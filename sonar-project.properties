# SonarQube Cloud configuration for the SonarSource/sonarqube-scan-action
# CI step (.github/workflows/pull-requests.yml). This is a TypeScript/pnpm
# project (see 004-technology-contract.md) — no build tool (Maven/Gradle)
# drives the scan, this file is the sole configuration source.

sonar.organization=bbortt-github
sonar.projectKey=bbortt_spiritbound

sonar.sources=.
sonar.exclusions=**/node_modules/**,\
  **/dist/**,\
  client/src/generated/**,\
  src/clew/traceables/**,\
  site/**,\
  docs/spec/**,\
  .idea/**,\
  .github/**

# Unit-test coverage, written by `pnpm run vitest:coverage` (see
# vitest.config.ts) and uploaded by the CI step that runs just before the scan.
# Without this the new-code coverage condition reads 0% on every pull request
# and the quality gate fails whatever the change actually tests.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage-exempt, but still analysed for bugs and smells. Every path here is
# code that cannot execute under vitest, not code that is merely untested:
#
#   spacetimedb/src/index.ts  the reducer module, which only runs inside a
#                             published SpacetimeDB instance. It is verified
#                             black-box by spacetimedb/integration/**, whose
#                             HTTP round-trips no in-process coverage provider
#                             can attribute back to these lines. The logic that
#                             can be isolated already lives in
#                             spacetimedb/src/rules/** and is covered there.
#   client/src/scenes/**      Phaser scenes; need a canvas and a running game
#   client/src/ui/**          DOM panels built with innerHTML
#   client/src/db.ts          SpacetimeDB connection wiring
#   client/src/main.ts        bootstrap
#
# Keeping these out is what makes the 80% condition enforceable on the code
# that can carry tests. The project's own answer to the untestable remainder is
# to extract decisions into pure modules — `client/src/equipDecision.ts` is the
# pattern — so extracting more logic raises coverage rather than dodging it.
sonar.coverage.exclusions=spacetimedb/src/index.ts,\
  client/src/scenes/**,\
  client/src/ui/**,\
  client/src/db.ts,\
  client/src/main.ts,\
  tools/mapgen/index.ts,\
  **/*.test.ts,\
  spacetimedb/integration/**,\
  *.config.ts,\
  *.config.mjs,\
  scripts/**,\
  vitest.noTodoTests.ts
