# SonarQube Cloud configuration for the SonarSource/sonarqube-scan-action
# CI step (.github/workflows/pull-requests.yml). This is a TypeScript/pnpm
# project (see 004-technology-contract.md) — no build tool (Maven/Gradle)
# drives the scan, this file is the sole configuration source.

sonar.organization=bbortt-github
sonar.projectKey=bbortt_spiritbound

sonar.sources=.
sonar.exclusions=**/node_modules/**,\
  **/dist/**,\
  client/src/generated/**,\
  src/clew/traceables/**,\
  site/**,\
  docs/spec/**,\
  .idea/**,\
  .github/**
