name: Pull-Request Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: mr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: 'pnpm'
          node-version: 24
      - name: Install Dependencies
        run: pnpm install
      - name: Check Source Formatting
        run: pnpm run prettier:check
      - name: Check Markdown Formatting
        run: pnpm lint:markdown
      - name: Check license headers
        run: node scripts/ensure-license-header.mjs --check
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Sonar needs full history for blame and new-code detection. Fetch it
          # here rather than with a later `git fetch --unshallow`, which cannot
          # authenticate against a private repo once credentials are not
          # persisted.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: 'pnpm'
          node-version: 24
      - name: Install Dependencies
        run: pnpm install
      - name: Unit tests
        run: pnpm run vitest
      - name: Start SpacetimeDB
        run: docker run -d --name spiritbound-ci -p 3000:3000 clockworklabs/spacetime:latest start --in-memory
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 30); do
            curl -sf -X POST http://localhost:3000/v1/identity > /dev/null && exit 0
            sleep 1
          done
          echo "SpacetimeDB did not become ready in time" >&2
          exit 1
      - name: Bundle SpacetimeDB module
        run: pnpm run spacetime:bundle
      - name: Publish SpacetimeDB module
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/project" \
            clockworklabs/spacetime:latest publish --anonymous --no-config \
            -j /project/spacetimedb/dist/bundle.js \
            --server http://localhost:3000 spiritbound --yes
      - name: Integration tests
        run: pnpm run vitest:integration
      - name: Stop SpacetimeDB
        if: always()
        run: docker rm -f spiritbound-ci || true
      - name: Cache SonarQube Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: "!contains(github.actor, 'dependabot')"
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Sonar Analysis
        if: "!contains(github.actor, 'dependabot')"
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  specs:
    name: Specifications with @ariadne-systems/clew
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: 'pnpm'
          node-version: 24
      - name: Install Dependencies
        run: pnpm install
      - name: Check clew
        run: pnpm exec clew check
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please-') && !startsWith(github.ref, 'refs/heads/release-please-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99
