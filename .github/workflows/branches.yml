name: Application CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - name: Check if PR exists
        uses: 8BitJonny/gh-get-current-pr@4056877062a1f3b624d5d4c2bedefa9cf51435c9
        id: check
        with:
          filterOutClosed: true
          filterOutDraft: true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        with:
          cache: 'pnpm'
          node-version: 24
      - name: Install Dependencies
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        run: pnpm install
      - name: Unit tests
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        run: pnpm run vitest
      - name: Start SpacetimeDB
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        run: docker run -d --name spiritbound-ci -p 3000:3000 clockworklabs/spacetime:latest start --in-memory
      - name: Wait for SpacetimeDB
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        run: |
          for i in $(seq 1 30); do
            curl -sf -X POST http://localhost:3000/v1/identity > /dev/null && exit 0
            sleep 1
          done
          echo "SpacetimeDB did not become ready in time" >&2
          exit 1
      - name: Bundle SpacetimeDB module
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        run: pnpm run spacetime:bundle
      - name: Publish SpacetimeDB module
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/project" \
            clockworklabs/spacetime:latest publish --anonymous --no-config \
            -j /project/spacetimedb/dist/bundle.js \
            --server http://localhost:3000 spiritbound --yes
      - name: Integration tests
        if: github.ref == 'refs/heads/main' || steps.check.outputs.pr_found == 'false'
        run: pnpm run vitest:integration
      - name: Stop SpacetimeDB
        if: always()
        run: docker rm -f spiritbound-ci || true
