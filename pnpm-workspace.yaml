allowBuilds:
  esbuild: true
overrides:
  # markdownlint 0.42.0 pins re2js 2.8.6 exactly; 2.8.7 is the first release patched for
  # GHSA-gg6h-894w-4m9c, and no markdownlint version asks for it yet. Keyed on the vulnerable
  # range rather than on the package, so it rewrites only what carries the advisory and stops
  # applying by itself once a dependency asks for a patched version.
  're2js@<2.8.7': 2.8.7
packages:
  - 'client'
  - 'spacetimedb'
